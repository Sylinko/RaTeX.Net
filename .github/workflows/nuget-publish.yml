name: Publish NuGet packages

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
            library: ratex_ffi.dll
          - rid: osx-arm64
            runner: macos-15
            library: libratex_ffi.dylib
          - rid: osx-x64
            runner: macos-15-intel
            library: libratex_ffi.dylib
          - rid: linux-x64
            runner: ubuntu-22.04
            library: libratex_ffi.so
          - rid: linux-arm64
            runner: ubuntu-22.04-arm
            library: libratex_ffi.so
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Get-Content build/native.json -Raw | ConvertFrom-Json
          rustup toolchain install $config.toolchain --profile minimal --component rust-docs

      - name: Install Rust (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          toolchain="$(/usr/bin/plutil -extract toolchain raw -o - build/native.json)"
          rustup toolchain install "$toolchain" --profile minimal --component rust-docs

      - name: Install Rust (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          toolchain="$(python3 -c 'import json; print(json.load(open("build/native.json"))["toolchain"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rust-docs

      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/build-windows-native.ps1

      - name: Build native library (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash build/build-mac-native.sh "${{ matrix.rid }}"

      - name: Build native library (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash build/build-linux-native.sh "${{ matrix.rid }}"

      - name: Upload native library and notices
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: |
            src/RaTeX.Net/runtimes/${{ matrix.rid }}/native/${{ matrix.library }}
            licenses/THIRD_PARTY_NOTICES.${{ matrix.rid }}.txt
          if-no-files-found: error

  pack:
    name: Test, pack and publish
    needs: native
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Collect native libraries and notices
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: .

      - name: Require every configured RID
        run: |
          $config = Get-Content build/native.json -Raw | ConvertFrom-Json
          foreach ($target in $config.targets.PSObject.Properties) {
            $rid = $target.Name
            $library = "src/RaTeX.Net/runtimes/$rid/native/$($target.Value.library)"
            $notice = "licenses/THIRD_PARTY_NOTICES.$rid.txt"
            foreach ($path in @($library, $notice)) {
              if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Missing artifact for ${rid}: $path"
              }
            }
          }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore RaTeX.slnx --locked-mode

      - name: Prepare release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          $version = $env:RELEASE_TAG -creplace '^v', ''
          $versionPattern = '^[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
          if ($version -cnotmatch $versionPattern) {
            throw "Release tag '$($env:RELEASE_TAG)' must be a version such as v1.2.3 or v1.2.3-preview.1."
          }

          $versionParts = @(($version -split '[-+]')[0] -split '\.')
          while ($versionParts.Count -lt 4) {
            $versionParts += '0'
          }
          $assemblyVersion = $versionParts -join '.'

          $releaseNotes = $env:RELEASE_BODY
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            $releaseNotes = "See release $($env:RELEASE_TAG)."
          }

          # Preserve Markdown code containing MSBuild's reserved characters.
          $escapedNotes = $releaseNotes.Replace('%', '%25')
          foreach ($character in @('$', '@', "'", ';', '?', '*', '(', ')')) {
            $escapedNotes = $escapedNotes.Replace($character, ('%{0:X2}' -f [int][char]$character))
          }
          $escapedNotes = [System.Security.SecurityElement]::Escape($escapedNotes)
          $releaseProps = Join-Path $env:RUNNER_TEMP 'RaTeX.Release.props'
          $properties = @(
            '<Project>'
            '  <PropertyGroup>'
            "    <Version>$version</Version>"
            "    <PackageVersion>$version</PackageVersion>"
            "    <AssemblyVersion>$assemblyVersion</AssemblyVersion>"
            "    <FileVersion>$assemblyVersion</FileVersion>"
            "    <InformationalVersion>$version</InformationalVersion>"
            '    <IncludeSourceRevisionInInformationalVersion>false</IncludeSourceRevisionInInformationalVersion>'
            "    <PackageReleaseNotes>$escapedNotes</PackageReleaseNotes>"
            '    <IncludeSymbols>true</IncludeSymbols>'
            '    <SymbolPackageFormat>snupkg</SymbolPackageFormat>'
            '  </PropertyGroup>'
            '</Project>'
          ) -join [Environment]::NewLine
          [System.IO.File]::WriteAllText($releaseProps, $properties, [System.Text.UTF8Encoding]::new($false))
          "RELEASE_PROPS=$releaseProps" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build managed projects
        # Multi-target packing and per-framework builds use different import hooks.
        run: >-
          dotnet build RaTeX.slnx -c Release --no-restore
          "-p:CustomBeforeMicrosoftCommonTargets=$env:RELEASE_PROPS"
          "-p:CustomBeforeMicrosoftCommonCrossTargetingTargets=$env:RELEASE_PROPS"

      - name: Test managed projects on Windows
        run: dotnet test RaTeX.slnx -c Release --no-build --no-restore

      - name: Pack RaTeX with all native libraries
        run: >-
          dotnet pack src/RaTeX.Net/RaTeX.Net.csproj -c Release --no-build --no-restore -o artifacts/packages
          "-p:CustomBeforeMicrosoftCommonTargets=$env:RELEASE_PROPS"
          "-p:CustomBeforeMicrosoftCommonCrossTargetingTargets=$env:RELEASE_PROPS"

      - name: Pack RaTeX.Avalonia
        run: >-
          dotnet pack src/RaTeX.Avalonia/RaTeX.Avalonia.csproj -c Release --no-build --no-restore -o artifacts/packages
          "-p:CustomBeforeMicrosoftCommonTargets=$env:RELEASE_PROPS"
          "-p:CustomBeforeMicrosoftCommonCrossTargetingTargets=$env:RELEASE_PROPS"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/packages -Filter '*.nupkg' -File | Sort-Object Name)
          if ($packages.Count -ne 2) {
            throw 'Expected the RaTeX and RaTeX.Avalonia packages.'
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE) {
              exit $LASTEXITCODE
            }
          }
